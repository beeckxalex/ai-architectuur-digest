name: YouTube digest

on:
  schedule:
    - cron: "17 18 * * 0"   # Sundays 18:17 UTC, before the Monday newsletter run
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fetch_youtube.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update YouTube digest"
          git push
